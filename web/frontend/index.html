<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Invoice Confirmation App 📱</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <h1>🧾 Invoice Checker</h1>
        <p class="subtitle">Validação de Faturas</p>
    </header>

    <!-- Main Container -->
    <main class="container">

        <!-- Step 1: Import WhatsApp -->
        <section class="card" id="step-whatsapp">
            <div class="card-header">
                <span class="step-number">1</span>
                <h2>📱 Pedido WhatsApp</h2>
            </div>
            <div class="card-body">
                <div class="tab-buttons">
                    <button class="tab-btn active" data-tab="paste">✍️ Colar Texto</button>
                    <button class="tab-btn" data-tab="file">📁 Ficheiro</button>
                </div>

                <!-- Paste Tab -->
                <div class="tab-content active" id="tab-paste">
                    <textarea
                        id="whatsapp-text"
                        placeholder="Cole aqui o pedido do WhatsApp...&#10;&#10;Exemplo:&#10;MAR AZUL LDA&#10;Restaurante Sol Nascente&#10;5 CAMARÃO 20/30&#10;2 POTA LIMPA&#10;1 LULA INTEIRA"
                        rows="8"
                    ></textarea>
                    <button class="btn btn-primary btn-block" onclick="uploadWhatsAppText()">
                        📤 Enviar Texto
                    </button>
                </div>

                <!-- File Tab -->
                <div class="tab-content" id="tab-file">
                    <div class="file-input-wrapper">
                        <input type="file" id="whatsapp-file" accept=".txt" onchange="uploadWhatsAppFile()">
                        <label for="whatsapp-file" class="file-label">
                            <span class="icon">📁</span>
                            <span class="text">Selecionar ficheiro .txt</span>
                        </label>
                    </div>
                </div>

                <!-- Status -->
                <div class="status-message" id="whatsapp-status" style="display: none;"></div>
            </div>
        </section>

        <!-- Step 2: Import Invoice -->
        <section class="card" id="step-invoice">
            <div class="card-header">
                <span class="step-number">2</span>
                <h2>📊 Fatura SAGE</h2>
            </div>
            <div class="card-body">
                <div class="file-input-wrapper">
                    <input type="file" id="invoice-file" accept=".xlsx,.xls,.csv,.pdf" onchange="uploadInvoiceFile()">
                    <label for="invoice-file" class="file-label">
                        <span class="icon">📂</span>
                        <span class="text">Selecionar fatura<br><small>(Excel, CSV ou PDF)</small></span>
                    </label>
                </div>

                <!-- Status -->
                <div class="status-message" id="invoice-status" style="display: none;"></div>
            </div>
        </section>

        <!-- Step 3: Compare -->
        <section class="card" id="step-compare">
            <div class="card-header">
                <span class="step-number">3</span>
                <h2>🔍 Comparar</h2>
            </div>
            <div class="card-body">
                <button class="btn btn-success btn-block btn-large" id="compare-btn" onclick="compareData()" disabled>
                    🔍 Comparar Agora
                </button>

                <!-- Loading -->
                <div class="loading" id="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>A processar...</p>
                </div>
            </div>
        </section>

        <!-- Results -->
        <section class="card" id="results-section" style="display: none;">
            <div class="card-header">
                <h2>📋 Resultado</h2>
            </div>
            <div class="card-body">
                <!-- Status Badge -->
                <div class="result-status" id="result-status"></div>

                <!-- Summary -->
                <div class="result-summary" id="result-summary"></div>

                <!-- Divergences List -->
                <div class="divergences-list" id="divergences-list"></div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="btn btn-outline" onclick="downloadPDF()">
                        📄 Download PDF
                    </button>
                    <button class="btn btn-outline" onclick="downloadExcel()">
                        📊 Download Excel
                    </button>
                    <button class="btn btn-outline btn-secondary" onclick="resetApp()">
                        🔄 Nova Comparação
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p>Invoice Confirmation App v1.0 | <a href="#about" onclick="showAbout()">Sobre</a></p>
    </footer>

    <!-- Toast Notifications -->
    <div class="toast" id="toast"></div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
